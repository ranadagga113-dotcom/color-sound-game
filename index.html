<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة اختبار الذاكرة بالألوان والنغمات</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #181825;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #cba6f7;
        }
        .status {
            font-size: 18px;
            margin-bottom: 20px;
            min-height: 28px;
            font-weight: bold;
        }
        .board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .btn-color {
            height: 140px;
            border-radius: 15px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.15s, transform 0.1s;
            border: 4px solid #11111b;
        }
        .btn-color:active {
            transform: scale(0.96);
        }
        .btn-color.active {
            opacity: 1;
            box-shadow: 0 0 25px currentColor;
        }
        #green { background-color: #a6e3a1; color: #a6e3a1; }
        #red { background-color: #f38ba8; color: #f38ba8; }
        #yellow { background-color: #f9e2af; color: #f9e2af; }
        #blue { background-color: #89b4fa; color: #89b4fa; }

        .start-btn {
            padding: 12px 30px;
            font-size: 18px;
            background-color: #cba6f7;
            color: #11111b;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .start-btn:hover {
            background-color: #b4befe;
        }
        .start-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>اختبار الذاكرة والنغمات</h1>
        <div class="status" id="status">اضغط "ابدأ اللعبة" للبدء</div>
        
        <div class="board">
            <div class="btn-color" id="green" onclick="handleUserClick('green')"></div>
            <div class="btn-color" id="red" onclick="handleUserClick('red')"></div>
            <div class="btn-color" id="yellow" onclick="handleUserClick('yellow')"></div>
            <div class="btn-color" id="blue" onclick="handleUserClick('blue')"></div>
        </div>

        <button class="start-btn" id="startBtn" onclick="startGame()">ابدأ اللعبة</button>
    </div>

    <script>
        const colors = ['green', 'red', 'yellow', 'blue'];
        const frequencies = { green: 261.63, red: 329.63, yellow: 392.00, blue: 523.25 }; // نغمات دو-مي-صول-دو
        
        let sequence = [];
        let userSequence = [];
        let level = 0;
        let isPlayingSequence = false;
        let audioCtx = null;

        const statusDisplay = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');

        // إنشاء محرك الصوت
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // تشغيل نغمة عند الضغط أو وميض اللون
        function playTone(color, duration = 300) {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.value = frequencies[color];
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration / 1000);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration / 1000);
        }

        function flashButton(color) {
            const btn = document.getElementById(color);
            btn.classList.add('active');
            playTone(color);
            setTimeout(() => {
                btn.classList.remove('active');
            }, 300);
        }

        function startGame() {
            sequence = [];
            userSequence = [];
            level = 0;
            startBtn.style.display = 'none';
            nextRound();
        }

        function nextRound() {
            level++;
            userSequence = [];
            statusDisplay.innerText = `المرحلة ${level}`;
            statusDisplay.style.color = '#cdd6f4';
            
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            sequence.push(randomColor);

            playSequence();
        }

        function playSequence() {
            isPlayingSequence = true;
            let i = 0;

            const interval = setInterval(() => {
                flashButton(sequence[i]);
                i++;

                if (i >= sequence.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        isPlayingSequence = false;
                    }, 300);
                }
            }, 600);
        }

        function handleUserClick(color) {
            if (isPlayingSequence || sequence.length === 0) return;

            flashButton(color);
            userSequence.push(color);

            const currentIndex = userSequence.length - 1;

            if (userSequence[currentIndex] !== sequence[currentIndex]) {
                gameOver();
                return;
            }

            if (userSequence.length === sequence.length) {
                isPlayingSequence = true;
                setTimeout(nextRound, 1000);
            }
        }

        function gameOver() {
            statusDisplay.innerText = `خسرت! وصلت للمرحلة ${level}`;
            statusDisplay.style.color = '#f38ba8';
            
            // صوت الخسارة
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = 120;
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);

            sequence = [];
            startBtn.style.display = 'inline-block';
            startBtn.innerText = 'حاول مجدداً';
        }
    </script>
</body>
</html>
